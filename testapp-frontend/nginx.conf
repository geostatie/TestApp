server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compress text responses. Angular's JS bundle is the main beneficiary.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain
                      text/css
                      application/javascript
                      application/json
                      image/svg+xml;

    # NOTE ON add_header INHERITANCE
    # nginx does not merge add_header directives down into a location that
    # declares its own. A location with a Cache-Control header would therefore
    # lose every security header set at server level, so they are repeated in
    # each location below. Verbose, but it is the only way to get it right.

    add_header X-Content-Type-Options "nosniff"                      always;
    add_header X-Frame-Options        "DENY"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Fingerprinted assets (main-QWXCFHLC.js) can be cached indefinitely —
    # a new build produces a new filename.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable"                 always;
        add_header X-Content-Type-Options "nosniff"                   always;
        add_header X-Frame-Options        "DENY"                      always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # Runtime config is rewritten on every container start. Caching it would
    # pin the app to a previous deployment's API URL.
    location = /config.json {
        add_header Cache-Control "no-store"                          always;
        add_header X-Content-Type-Options "nosniff"                   always;
        add_header X-Frame-Options        "DENY"                      always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # The shell is not fingerprinted, so it must be revalidated every time.
    location = /index.html {
        add_header Cache-Control "no-cache"                          always;
        add_header X-Content-Type-Options "nosniff"                   always;
        add_header X-Frame-Options        "DENY"                      always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # SPA fallback. Without this, refreshing or deep-linking to any client-side
    # route returns 404 because no such file exists on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
