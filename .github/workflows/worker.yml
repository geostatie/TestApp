name: worker

on:
  push:
    branches: [main]
    paths:
      - 'TestApp.Worker/**'
      - '.github/workflows/worker.yml'
  pull_request:
    paths:
      - 'TestApp.Worker/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/testapp-worker
  CONTAINER_APP: testapp-worker
  RESOURCE_GROUP: testapp-rg

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build TestApp.Worker/TestApp.Worker.csproj -c Release --nologo

      # Required for the GitHub Actions build cache: the runner's default
      # buildx driver is "docker", which cannot export a cache.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The worker Dockerfile builds from the solution root, since it copies
      # TestApp.Worker/TestApp.Worker.csproj by path.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: TestApp.Worker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Separate job so pull requests build without registering a deployment.
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # required to request the OIDC token for Azure login

    # Binding a job to an environment changes the OIDC subject claim to
    # :environment:<name>, so a matching federated credential must exist.
    environment:
      name: worker-production

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container Apps
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name "${{ env.CONTAINER_APP }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --image "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
